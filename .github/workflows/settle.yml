name: Pay out the nightly pot

on:
  schedule:
    - cron: "25 * * * *"   # every hour at :25 (UTC)
    - cron: "45 10 * * *"  # once more before picks close at 12:00 UTC, for the Telegram last call
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      telegram_test:
        description: "Also send a test post to Telegram"
        type: boolean
        default: false

concurrency:
  group: settle
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to start the diary run when GitHub's own schedule is late (last step)

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 20    # room for retries: a timed-out request can take 100 s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # Node 20 is past its end of life
      - name: Install
        working-directory: settler
        run: npm ci --no-audit --no-fund
      - name: Settle finished nights
        working-directory: settler
        env:
          SETTLER_PRIVATE_KEY: ${{ secrets.SETTLER_PRIVATE_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          POT_ADDRESS: ${{ vars.POT_ADDRESS }}
        run: |
          # Up to 3 tries, 30 s apart: the API or the RPC sometimes times out. Safe to repeat.
          for try in 1 2 3; do
            node settle.mjs && exit 0
            [ "$try" -lt 3 ] && { echo "Try $try failed; trying again in 30 s."; sleep 30; }
          done
          exit 1
      # Night Cards: once a season night's results are final, mints players' cards to the
      # wallets they linked. Does nothing until CARDS_ADDRESS is set in config.js.
      - name: Mint Night Cards
        if: always()
        continue-on-error: true    # a slow RPC shouldn't stop the Telegram posts
        working-directory: settler
        env:
          SETTLER_PRIVATE_KEY: ${{ secrets.SETTLER_PRIVATE_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
        run: |
          # Up to 3 tries, 30 s apart: the API or the RPC sometimes times out. Safe to repeat.
          for try in 1 2 3; do
            node cards.mjs && exit 0
            [ "$try" -lt 3 ] && { echo "Try $try failed; trying again in 30 s."; sleep 30; }
          done
          exit 1
      # Telegram: results and the last call. Does nothing until TELEGRAM_BOT_TOKEN (secret)
      # and TELEGRAM_CHAT_ID (variable) are set. Runs even if the payout step failed.
      - name: Load what was already posted
        if: always()
        uses: actions/cache/restore@v5
        with:
          path: .bot-state
          key: announce-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: announce-
      - name: Post to Telegram
        id: post
        if: always()
        working-directory: settler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          POT_ADDRESS: ${{ vars.POT_ADDRESS }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
        # Its memory is only saved when it changed, so frequent runs don't pile up copies.
        run: |
          before=$(sha1sum ../.bot-state/announce.json 2>/dev/null || true)
          set +e
          node announce.mjs
          code=$?
          after=$(sha1sum ../.bot-state/announce.json 2>/dev/null || true)
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          exit $code
      - name: Remember what was posted
        if: always() && steps.post.outputs.changed == 'true'
        uses: actions/cache/save@v5
        with:
          path: .bot-state
          key: announce-${{ github.run_id }}-${{ github.run_attempt }}
      # GitHub often starts the diary's daily run hours late, or skips it. This workflow runs
      # every 15 minutes, so it starts that run once the last night has ended and the diary
      # hasn't run since (or its run failed over 2 hours ago).
      - name: Start the diary run if it's late
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          run=$(gh run list --workflow archive.yml --limit 1 --json createdAt,status,conclusion --jq '.[0] // {}' || echo '{}')
          start=$(node -e '
            const L = require("./src/logic.js");
            const run = JSON.parse(process.argv[1] || "{}"), now = Date.now();
            const ended = L.nightEnd(L.addDays(L.liveNightAt(now - 40 * 60e3), -1)) + 40 * 60e3;   // last night, 40 minutes on
            const at = Date.parse(run.createdAt) || 0;
            const fine = run.status !== "completed" || run.conclusion === "success" || now - at < 2 * 3600e3;
            console.log(at >= ended && fine ? "no" : "yes");' "$run")
          if [ "$start" = yes ]; then
            gh workflow run archive.yml --ref main && echo "Started the diary run: it hadn't run since the last night ended."
          else
            echo "The diary run is up to date."
          fi
