name: Pay out the nightly pot

on:
  schedule:
    - cron: "25 * * * *"   # every hour at :25 (UTC)
    - cron: "45 10 * * *"  # once more before picks close at 12:00 UTC, for the Telegram last call
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      telegram_test:
        description: "Also send a test post to Telegram"
        type: boolean
        default: false

concurrency:
  group: settle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: settler
        run: npm ci --no-audit --no-fund
      - name: Settle finished nights
        working-directory: settler
        env:
          SETTLER_PRIVATE_KEY: ${{ secrets.SETTLER_PRIVATE_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          POT_ADDRESS: ${{ vars.POT_ADDRESS }}
        run: node settle.mjs
      # Telegram: results and the last call. Does nothing until TELEGRAM_BOT_TOKEN (secret)
      # and TELEGRAM_CHAT_ID (variable) are set. Runs even if the payout step failed.
      - name: Load what was already posted
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .bot-state
          key: announce-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: announce-
      - name: Post to Telegram
        id: post
        if: always()
        working-directory: settler
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          POT_ADDRESS: ${{ vars.POT_ADDRESS }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
        # Its memory is only saved when it changed, so frequent runs don't pile up copies.
        run: |
          before=$(sha1sum ../.bot-state/announce.json 2>/dev/null || true)
          set +e
          node announce.mjs
          code=$?
          after=$(sha1sum ../.bot-state/announce.json 2>/dev/null || true)
          if [ "$before" != "$after" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          exit $code
      - name: Remember what was posted
        if: always() && steps.post.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .bot-state
          key: announce-${{ github.run_id }}-${{ github.run_attempt }}
