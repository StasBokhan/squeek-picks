name: Check a pot

# Before the page switches to a newly deployed pot: checks it's the contract in this
# repository with the same owner and payout bot, and shows where every pot stands.
# Reads only; holds no wallet key. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      address:
        description: "Pot address to check (optional: the pots in config.js are always shown)"
        required: false
        default: ""
      cards:
        description: "Night Cards address to check (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # Node 20 is past its end of life
      - name: Install
        working-directory: settler
        run: npm ci --no-audit --no-fund
      - name: Check
        working-directory: settler
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          CHECK_ADDRESS: ${{ inputs.address }}
          CHECK_CARDS: ${{ inputs.cards }}
        run: node inspect.mjs
