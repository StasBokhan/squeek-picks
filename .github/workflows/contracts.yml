name: Pot contract tests

# Runs the pot contract's tests (contracts/test) whenever the contract or its tests
# change: the edges the IMD swarm audit checked stay pinned. Reads only.
on:
  push:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Test
        env:
          HARDHAT_DISABLE_TELEMETRY_PROMPT: "true"
        run: npm test
