<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Squeek Picks overlay</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{background:transparent;margin:0}</style>
</head>
<body>
<script>
  // squeekpicks.xyz/overlay: the stream overlay. Extra settings carry over (e.g. ?theme=light).
  location.replace("./?view=overlay" + (location.search ? "&" + location.search.slice(1) : ""));
</script>
</body>
</html>
